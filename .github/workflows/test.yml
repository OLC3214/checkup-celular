name: Testar no Android
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Gerar APKs
        run: |
          gradle assembleDebug -PappId=com.thetruth
          cp app/build/outputs/apk/debug/app-debug.apk espiao-teste.apk
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app.apk
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rodar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/ui-test.sh
      - name: Publicar prints no branch "testes"
        if: always()
        run: |
          git config user.name "teste-automatico"
          git config user.email "noreply@users.noreply.github.com"
          git checkout --orphan testes
          git rm -rf --cached . > /dev/null
          git add -f test-out
          git commit -m "Resultado do teste ${{ github.sha }}"
          git push -f origin testes
