name: Gerar APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar assinatura fixa
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/checkup.jks
            echo "KEYSTORE_FILE=$RUNNER_TEMP/checkup.jks" >> $GITHUB_ENV
            echo "Assinatura fixa: OK"
          else
            echo "::warning::Sem segredo KEYSTORE_B64: APK sai com assinatura de teste e não vai atualizar por cima"
          fi
      - run: gradle assembleDebug -Pvc=${{ github.run_number }}
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk CheckupCelular.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CheckupCelular-apk
          path: CheckupCelular.apk
      # Publica o APK num link fixo: /releases/latest/download/CheckupCelular.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Check-up Celular v1.0.${{ github.run_number }}
          make_latest: true
          files: CheckupCelular.apk
