name: Gerar APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar assinatura fixa
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Sem segredo KEYSTORE_B64: APK sai com assinatura de teste e não vai atualizar por cima"
            exit 0
          fi
          # Remove espaços, quebras de linha e o que não for base64 (colagem com sujeira)
          CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=')
          PASS=$(printf '%s' "$KEYSTORE_PASS" | tr -d '[:space:]')
          echo "Tamanho KEYSTORE_B64 limpo: ${#CLEAN} (esperado 3620) | tamanho KEYSTORE_PASS: ${#PASS} (esperado 32)"
          if ! printf '%s' "$CLEAN" | base64 -d > $RUNNER_TEMP/checkup.jks 2>/dev/null; then
            echo "::error::KEYSTORE_B64 não é um base64 válido (tamanho ${#CLEAN}, esperado 3620). Cole a linha longa inteira de novo."
            exit 1
          fi
          if ! keytool -list -keystore $RUNNER_TEMP/checkup.jks -storepass "$PASS" -alias checkup > /dev/null 2>&1; then
            echo "::error::A chave abriu, mas a senha KEYSTORE_PASS não confere (tamanho ${#PASS}, esperado 32)."
            exit 1
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/checkup.jks" >> $GITHUB_ENV
          echo "::notice::Assinatura fixa: OK"
      - run: gradle assembleDebug -Pvc=${{ github.run_number }}
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk CheckupCelular.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CheckupCelular-apk
          path: CheckupCelular.apk
      # Publica o APK num link fixo: /releases/latest/download/CheckupCelular.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Check-up Celular v1.0.${{ github.run_number }}
          make_latest: true
          files: CheckupCelular.apk
